name: Content studio checks
on:
  push:
    branches-ignore: [autopilot-state]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: python -m pip install -r requirements.txt -c requirements.lock
      - run: python -m pytest -q
  source-contract:
    # Public read-only contract probe. No Meta credentials or publishing permissions.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: python -m pip install -r requirements.txt -c requirements.lock
      - name: Authentic NASA footage Reel (never publishes)
        run: python -m autopilot.footage_demo --output data/authentic-footage
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: authentic-footage-reel
          path: |
            data/authentic-footage/
            !data/authentic-footage/sources/*.mp4
            !data/authentic-footage/work/
          retention-days: 7
